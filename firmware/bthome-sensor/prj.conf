CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_OBSERVER=n

CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y

# The whole no-stored-state design (main.c's elapsed_ms()) depends on GRTC
# SYSCOUNTER surviving System OFF, which requires GRTC to be clocked from
# LFXO, not LFRC (datasheet Table 21: LFRC is System-ON only). Nothing here
# asserts that — it works because the DK's board DTS configures &lfxo. A port
# to different hardware must not lose this assumption silently.
