CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=25
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="Soil"

# The deployed sensor remains OTA-capable. A BLE connection during the normal
# advertising window holds the device awake while MCUmgr uploads the next
# signed image; an unconnected wake still returns to System OFF.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_HWINFO=y
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
